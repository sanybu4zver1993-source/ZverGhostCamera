name: Build and Release APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Версия релиза (например 1.2; по умолчанию авто из versionName)"
        required: false
        default: ""
  release:
    types: [ created, published ]

jobs:
  build:
    name: Build Android APK (Debug + R8 Release)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Resolve Version and Tag
        id: meta
        run: |
          BASE_VER=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          BASE_VER="${BASE_VER:-1.0}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_version }}" ]; then
            VER="${{ inputs.release_version }}"
            TAG="v${VER#v}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VER="${TAG#v}"
          else
            VER="${BASE_VER}.${{ github.run_number }}"
            TAG="v${VER}"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_debug=ZverCamera-${TAG}-debug.apk" >> "$GITHUB_OUTPUT"
          echo "apk_release=ZverCamera-${TAG}-release.apk" >> "$GITHUB_OUTPUT"

      - name: Create and Push Git Tag
        run: |
          git config --global user.name "Zver CI Bot"
          git config --global user.email "ci@zver.camera"
          git tag -f ${{ steps.meta.outputs.tag }}
          git push origin -f ${{ steps.meta.outputs.tag }} || true

      - name: Prepare Keystores (Debug + Release)
        run: |
          touch .env
          touch .env.example
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || base64 --decode debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -s "debug.keystore" ]; then
            echo "Debug keystore not found or empty, generating debug.keystore with keytool..."
            keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cp -f debug.keystore app/debug.keystore || true

          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Using repository RELEASE_KEYSTORE_BASE64 secret..."
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release-upload.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret found; generating signed CI release keystore (alias=upload)..."
            keytool -genkeypair -alias upload -keypass zver_ci_rel_2026 -keystore release-upload.jks -storepass zver_ci_rel_2026 -dname "CN=Zver Release,O=Zver,C=UA" -keyalg RSA -keysize 2048 -validity 10000
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release-upload.jks" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=zver_ci_rel_2026" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=zver_ci_rel_2026" >> "$GITHUB_ENV"
          fi
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Build Debug & R8 Release APKs
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          else
            gradle assembleDebug assembleRelease --no-daemon --stacktrace
          fi
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk "release_apks/${{ steps.meta.outputs.apk_debug }}"
          cp app/build/outputs/apk/release/app-release.apk "release_apks/${{ steps.meta.outputs.apk_release }}"
          if [ -f "app/build/outputs/mapping/release/mapping.txt" ]; then
            cp app/build/outputs/mapping/release/mapping.txt "release_apks/mapping-${{ steps.meta.outputs.tag }}.txt"
          fi
          if [ -f "app/build/outputs/logs/manifest-merger-release-report.txt" ]; then
            cp app/build/outputs/logs/manifest-merger-release-report.txt "release_apks/manifest-merger-release-${{ steps.meta.outputs.tag }}.txt"
          fi
          ls -lh release_apks/

      - name: Upload APKs & R8 Mapping Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZverCamera-${{ steps.meta.outputs.tag }}
          path: release_apks/
          if-no-files-found: error

      - name: Publish Versioned GitHub Release (Debug + Release APKs)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Zver Camera ${{ steps.meta.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_apks/${{ steps.meta.outputs.apk_release }}
            release_apks/${{ steps.meta.outputs.apk_debug }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach APKs to Manual Release Event
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release_apks/${{ steps.meta.outputs.apk_release }}
            release_apks/${{ steps.meta.outputs.apk_debug }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
